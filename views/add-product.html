<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="/">Master Shop</a>
        <ul class="nav-links">
          <li><a href="/">Shop</a></li>
          <li><a class="active" href="/admin/add-product">Add product</a></li>
        </ul>
      </nav>
    </header>

    <main class="page">
      <h1 class="page-title">Add Product</h1>
      <p class="page-subtitle">Create a new product and send it to the shop.</p>

      <section class="panel">
        <form class="form" action="/admin/add-product" method="post">
          <div class="form-group">
            <label for="title">Product title</label>
            <input
              type="text"
              name="title"
              id="title"
              placeholder="e.g. Wireless keyboard"
              required
              autofocus
            />
          </div>
          <button class="btn btn-primary" type="submit">Add product</button>
        </form>
      </section>
    </main>
  </body>
</html>
